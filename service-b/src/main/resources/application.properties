spring.application.name=service-b

management.tracing.sampling.probability=1.0
management.opentelemetry.resource-attributes.deployment.environment=local
management.opentelemetry.resource-attributes.service.namespace=otel-poc
management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4318/v1/traces
management.opentelemetry.metrics.export.otlp.endpoint=http://otel-collector:4318/v1/metrics